providers:
  litellm:
    # 这些模型以 anthropic-messages 协议访问（网关侧对应 anthropic 形态上游）
    modelOverrides:
      MiniMax-M3.1-Flash:
        api: anthropic-messages
        contextWindow: 512000
        thinking:
          mode: anthropic-adaptive
          efforts: [low, medium, high, xhigh, max]
          effortMap:
            low: low
            medium: medium
            high: high
          requiresEffort: true
      # 该 model group 的主上游 Ollama 有时在 thinking 模式下返回不带 thinking
      # 块的 assistant turn；DeepSeek 官方端点逐条校验，缺一条就整轮 400
      # （content[].thinking ... must be passed back）。组内以更严的一方定义重放契约。
      # OMP 18.13.1 起（上游按 #16739 自实现）只在“本轮”补块：最后一条带文本的
      # user 之后、缺 thinking 的 assistant 会被前置一个占位 thinking 块，文本必须
      # 非空（litellm 适配层丢弃空块），签名可为空；更早的历史轮不补。只在本次请求
      # 开启 thinking 时生效。
      deepseek-v4.1-flash:
        api: anthropic-messages
        compat:
          requiresThinkingPresence: true
      # 网关侧这三个 group 是 chatgpt/ provider（上游 Codex 只有 Responses 形态），
      # 但 litellm 发现把 providers=["chatgpt"] 归到 openai 以外的路由，api 默认
      # 落成 openai-completions，只能走 litellm 的 chat→Responses 桥。这里显式
      # 改回 openai-responses，直接用 /v1/responses：原生加密 reasoning、
      # reasoning.effort 语义、以及 image_generation 等 Responses-only 工具。
      # thinking 档位仍来自 /model_group/info 的 reasoning_effort_levels 发现。
      gpt-6.1-sol: &litellm_responses
        api: openai-responses
      gpt-6-astra: *litellm_responses
      gpt-6-luna: *litellm_responses
      # 网关侧 1M 窗口原样透传上游，本地按 256K 封顶（256*1024 = 262144，
      # 与 kimi-code provider 的 k3.1-pro 覆盖同档），控制长上下文消耗。
      kimi-k3.1-pro:
        contextWindow: 262144
