setupVersion: 1
memory:
  backend: hindsight
hindsight:
  scoping: per-project-tagged
  mentalModelAutoSeed: true
  autoRetain: false
  recallBudget: high
  recallMaxTokens: 4096
  recallContextTurns: 3
providers:
  webSearchOrder:
    - exa
    - tavily
    - brave
    - codex
    - kimi
    - firecrawl
    - duckduckgo
    - perplexity
    - startpage
    - google
    - ecosia
    - mojeek
    - public
    - gemini
    - xai
    - zai
    - tinyfish
    - jina
    - kagi
    - parallel
    - synthetic
    - searxng
    - anthropic
  imageOrder:
    - openai-codex
  tinyModel: lfm2-700m
  tinyModelDevice: gpu
  tinyModelDtype: q4
  unexpectedStopModel: llama3.2:3b
generate_image:
  enabled: true
modelRoles:
  tiny: openai-codex/gpt-5.6-luna:max
  slow: openai-codex/gpt-5.6-sol:max
  smol: openai-codex/gpt-5.6-luna:max
  default: kimi-code/k3-256k:max
  vision: openai-codex/gpt-5.6-luna:max
  plan: openai-codex/gpt-5.6-sol:max
  advisor: kimi-code/k3-256k:max
  task: openai-codex/gpt-5.6-luna:max
  designer: kimi-code/k3-256k:max
  commit: openai-codex/gpt-5.6-luna:max
extensions:
  - /etc/nixos/home/zerozawa/ai/omp/agent/extensions/wakatime.ts
  - /etc/nixos/home/zerozawa/ai/omp/agent/extensions/commit-tool.ts
  - /etc/nixos/home/zerozawa/ai/omp/agent/extensions/alarm-clock.ts
task:
  enableLsp: true
  showResolvedModelBadge: true
  agentModelOverrides:
    architecture-analyzer: kimi-code/k3-256k:max
    article-analyzer: openai-codex/gpt-5.6-luna:max
    assemble-reviewer: openai-codex/gpt-5.6-luna:max
    design-analyzer: kimi-code/k3-256k:max
    domain-analyzer: kimi-code/k3-256k:max
    file-analyzer: openai-codex/gpt-5.6-luna:max
    graph-reviewer: kimi-code/k3-256k:max
    knowledge-graph-guide: openai-codex/gpt-5.6-luna:max
    project-scanner: openai-codex/gpt-5.6-luna:max
    tour-builder: kimi-code/k3-256k:max
    designer: kimi-code/k3-256k:max
    librarian: openai-codex/gpt-5.6-luna:max
    reviewer: kimi-code/k3-256k:max
    scout: openai-codex/gpt-5.6-luna:max
    security-reviewer: openai-codex/gpt-5.6-sol:max
    sonic: openai-codex/gpt-5.6-luna:max
    task: openai-codex/gpt-5.6-luna:max
  eager: preferred
dev:
  autoqaConsent: denied
  autoqa: true
lsp:
  diagnosticsOnEdit: true
  formatOnWrite: true
  lazy: true
display:
  showTokenUsage: true
  cacheMissMarker: true
branchSummary:
  enabled: true
contextPromotion:
  enabled: true
read:
  toolResultPreview: true
  renderMarkdown: true
  summarize:
    prose: true
github:
  enabled: true
  cache:
    enabled: true
    softTtlSec: 300
    hardTtlSec: 604800
defaultThinkingLevel: auto
advisor:
  enabled: false
  subagents: false
tier:
  advisor: none
provider:
  appendOnlyContext: "on"
colorBlindMode: true
statusLine:
  separator: powerline
  transparent: false
python:
  kernelMode: session
readLineNumbers: true
steeringMode: all
git:
  enabled: true
images:
  describeForTextModels: true
astGrep:
  enabled: true
inspect_image:
  mode: auto
checkpoint:
  enabled: true
mcp:
  notifications: true
autolearn:
  enabled: true
  autoContinue: true
disabledExtensions:
  []
shellMinimizer:
  sourceOutlineLevel: aggressive
secrets:
  enabled: true
bash:
  direnv: auto
  autoBackground:
    enabled: true
security:
  enabled: true
browser:
  relay: true