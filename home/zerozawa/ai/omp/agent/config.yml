setupVersion: 2
memory:
  backend: hindsight
hindsight:
  scoping: per-project-tagged
  mentalModelAutoSeed: true
  autoRetain: true
  retainMode: last-turn
  recallBudget: high
  recallMaxTokens: 4096
  recallContextTurns: 3
  recallTypes:
    - world
    - experience
    - observation
providers:
  tinyModelDevice: gpu
  tinyModelDtype: q4
generate_image:
  enabled: true
alarmClock:
  deliverAs: aside
modelRoles:
  tiny: local/lfm2.5-230m
  # 决策/判定统一走本地 230M 小模型，不升级到云端
  judge: local/lfm2.5-230m
  slow: litellm/kimi-k3.1-pro:max
  smol: litellm/MiniMax-M3.1-Flash:max
  default: litellm/deepseek-v4.1-flash:max
  vision: litellm/gpt-6-luna:max
  plan: litellm/gpt-6-astra:max
  advisor: litellm/deepseek-v4.1-flash:max
  task: litellm/deepseek-v4.1-flash:max
  commit: litellm/deepseek-v4.1-flash:max
  web: web/exa
  # image 角色需要 kind=image 的模型；网关的 gpt-image-2 组是 image_generation
  # 模式，被 litellm 发现显式排除（exclude-discovery-modes），若在 models.yml 里
  # 声明静态条目又必须写 baseUrl（会把内网域名带进仓库）。因此不设 image 角色：
  # 会话模型是 gpt-6.x 组时，generate_image 走该模型的 hosted-image 载体自动出图。
  image: litellm-image/gpt-image-2
task:
  enableLsp: true
  showResolvedModelBadge: true
  agentModelOverrides:
    reviewer: litellm/kimi-k3.1-pro:max
    scout: litellm/gpt-6-luna:max
    security-reviewer: litellm/gpt-6.1-sol:max
    sonic: dspeak/peak=litellm/MiniMax-M3.1-Flash:max&default=litellm/deepseek-v4.1-flash:max
    task: litellm/deepseek-v4.1-flash:max
  eager: preferred
  agentAdvisor:
    task: "off"
  disabledAgents: []
dev:
  autoqaConsent: granted
  autoqa: true
lsp:
  diagnosticsOnEdit: true
  formatOnWrite: true
  lazy: true
display:
  showTokenUsage: true
  cacheMissMarker: true
branchSummary:
  enabled: true
contextPromotion:
  enabled: true
read:
  toolResultPreview: true
  renderMarkdown: true
  summarize:
    prose: true
github:
  enabled: true
  cache:
    enabled: true
    softTtlSec: 300
    hardTtlSec: 604800
# 固定档位，避免 auto 分类器（它走 judge 角色）
defaultThinkingLevel: high
advisor:
  enabled: false
tier:
  advisor: none
provider:
  appendOnlyContext: "on"
colorBlindMode: true
statusLine:
  separator: powerline
  transparent: false
python:
  kernelMode: session
readLineNumbers: true
steeringMode: all
git:
  enabled: true
images:
  describeForTextModels: true
astGrep:
  enabled: true
checkpoint:
  enabled: true
mcp:
  notifications: true
autolearn:
  enabled: true
  autoContinue: true
disabledExtensions: []
shellMinimizer:
  sourceOutlineLevel: aggressive
secrets:
  enabled: true
bash:
  direnv: auto
  autoBackground:
    enabled: false
security:
  enabled: true
browser:
  relay: true
  headless: true
composer:
  shape: rule
snapcompact:
  toolResults: false
features:
  # 关闭「意外停止」自动恢复（原 smart：机械重试 + 小模型判定纯文本停止）
  unexpectedStopDetection: none
retry:
  fallbackChains:
    web:
      - web/tavily
      - web/brave
      - web/kimi
    # image:
    #   - openai/gpt-image-2
    judge:
      - local/lfm2.5-230m
