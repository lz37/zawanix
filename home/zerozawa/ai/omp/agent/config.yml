setupVersion: 2
memory:
  backend: hindsight
hindsight:
  scoping: per-project-tagged
  mentalModelAutoSeed: true
  autoRetain: true
  retainMode: last-turn
  recallBudget: high
  recallMaxTokens: 4096
  recallContextTurns: 3
  recallTypes:
    - world
    - experience
    - observation
providers:
  tinyModelDevice: gpu
  tinyModelDtype: q4
generate_image:
  enabled: true
alarmClock:
  deliverAs: aside
modelRoles:
  tiny: "local/lfm2.5-230m"
  slow: openai-codex/gpt-6-astra:max
  smol: dspeak/peak=kimi-code/kimi-for-coding:max&default=litellm/deepseek-v4.1-flash:max
  default: kimi-code/k3:max
  vision: openai-codex/gpt-6-luna:max
  plan: openai-codex/gpt-6-astra:max
  advisor: dspeak/peak=kimi-code/kimi-for-coding:max&default=litellm/deepseek-v4.1-flash:max
  task: dspeak/peak=kimi-code/kimi-for-coding:max&default=litellm/deepseek-v4.1-flash:max
  commit: dspeak/peak=openai-codex/gpt-6-luna:max&default=litellm/deepseek-v4.1-flash:max
  web: web/exa
  image: openai-codex/gpt-image-1
  judge: typesafe/jev-latest
task:
  enableLsp: true
  showResolvedModelBadge: true
  agentModelOverrides:
    reviewer: kimi-code/k3:max
    scout: dspeak/peak=openai-codex/gpt-6-luna:max&default=litellm/deepseek-v4.1-flash:max
    security-reviewer: kimi-code/k3:max
    sonic: dspeak/peak=openai-codex/gpt-6-luna:max&default=litellm/deepseek-v4.1-flash:max
    task: dspeak/peak=kimi-code/kimi-for-coding:max&default=litellm/deepseek-v4.1-flash:max
  eager: preferred
  agentAdvisor:
    task: "off"
  disabledAgents: []
dev:
  autoqaConsent: granted
  autoqa: true
lsp:
  diagnosticsOnEdit: true
  formatOnWrite: true
  lazy: true
display:
  showTokenUsage: true
  cacheMissMarker: true
branchSummary:
  enabled: true
contextPromotion:
  enabled: true
read:
  toolResultPreview: true
  renderMarkdown: true
  summarize:
    prose: true
github:
  enabled: true
  cache:
    enabled: true
    softTtlSec: 300
    hardTtlSec: 604800
defaultThinkingLevel: auto
advisor:
  enabled: false
tier:
  advisor: none
provider:
  appendOnlyContext: "on"
colorBlindMode: true
statusLine:
  separator: powerline
  transparent: false
python:
  kernelMode: session
readLineNumbers: true
steeringMode: all
git:
  enabled: true
images:
  describeForTextModels: true
astGrep:
  enabled: true
checkpoint:
  enabled: true
mcp:
  notifications: true
autolearn:
  enabled: true
  autoContinue: true
disabledExtensions: []
shellMinimizer:
  sourceOutlineLevel: aggressive
secrets:
  enabled: true
bash:
  direnv: auto
  autoBackground:
    enabled: false
security:
  enabled: true
browser:
  relay: true
composer:
  shape: rule
snapcompact:
  toolResults: false
features:
  unexpectedStopDetection: smart
retry:
  fallbackChains:
    web:
      - web/tavily
      - web/brave
      - openai-codex/gpt-5.6-luna
      - web/kimi
      - web/firecrawl
      - web/duckduckgo
      - web/perplexity
      - web/startpage
      - web/google
      - web/ecosia
      - web/mojeek
      - web/public
      - google/gemini-2.5-flash
      - xai/grok-4.5
      - web/zai
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/parallel
      - web/synthetic
      - web/searxng
      - anthropic/claude-haiku-4-5
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai-oauth/grok-4.5
      - web/ollama
    image:
      - openai/gpt-image-1
      - google-antigravity/gemini-3-pro-image
      - xai/grok-imagine-image
      - xai-oauth/grok-imagine-image
      - openrouter/google/gemini-3-pro-image-preview
      - google/gemini-3-pro-image-preview
      - deepinfra/black-forest-labs/FLUX-2-pro
    judge:
      - local/llama3.2:3b
      - "@tiny"
      - "@smol"
      - "@default"
