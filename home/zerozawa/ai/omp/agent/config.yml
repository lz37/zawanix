setupVersion: 2
memory:
  backend: hindsight
hindsight:
  scoping: per-project-tagged
  mentalModelAutoSeed: true
  autoRetain: false
  recallBudget: high
  recallMaxTokens: 4096
  recallContextTurns: 3
providers:
  webSearchOrder:
    - exa
    - tavily
    - brave
    - codex
    - kimi
    - firecrawl
    - duckduckgo
    - perplexity
    - startpage
    - google
    - ecosia
    - mojeek
    - public
    - gemini
    - xai
    - zai
    - tinyfish
    - jina
    - kagi
    - parallel
    - synthetic
    - searxng
    - anthropic
  imageOrder:
    - openai-codex
  tinyModel: lfm2-700m
  tinyModelDevice: gpu
  tinyModelDtype: q4
  unexpectedStopModel: llama3.2:3b
generate_image:
  enabled: true
alarmClock:
  # 闹钟投递模式：aside = 切入运行中的 loop（step 边界注入，不打断在飞工具）；nextTurn = 等 turn 结束；steer = 立即 steer
  deliverAs: aside
modelRoles:
  tiny: dspeak/peak=openai-codex/gpt-5.6-luna:max&default=litellm/deepseek-v4-flash:max
  slow: openai-codex/gpt-5.6-sol:max
  smol: dspeak/peak=openai-codex/gpt-5.6-luna:max&default=litellm/deepseek-v4-flash:max
  default: kimi-code/k3-256k:max
  vision: openai-codex/gpt-5.6-luna:max
  plan: openai-codex/gpt-5.6-sol:max
  advisor: litellm/deepseek-v4-flash:max
  task: litellm/deepseek-v4-flash:max
  designer: kimi-code/k3-256k:max
  commit: dspeak/peak=openai-codex/gpt-5.6-luna:max&default=litellm/deepseek-v4-flash:max
extensions:
  - /etc/nixos/home/zerozawa/ai/omp/agent/extensions/wakatime.ts
task:
  enableLsp: true
  showResolvedModelBadge: true
  agentModelOverrides:
    architecture-analyzer: kimi-code/k3-256k:max
    article-analyzer: dspeak/peak=openai-codex/gpt-5.6-luna:max&default=litellm/deepseek-v4-flash:max
    assemble-reviewer: dspeak/peak=openai-codex/gpt-5.6-luna:max&default=litellm/deepseek-v4-flash:max
    design-analyzer: kimi-code/k3-256k:max
    domain-analyzer: kimi-code/k3-256k:max
    file-analyzer: dspeak/peak=openai-codex/gpt-5.6-luna:max&default=litellm/deepseek-v4-flash:max
    graph-reviewer: kimi-code/k3-256k:max
    knowledge-graph-guide: dspeak/peak=openai-codex/gpt-5.6-luna:max&default=litellm/deepseek-v4-flash:max
    project-scanner: dspeak/peak=openai-codex/gpt-5.6-luna:max&default=litellm/deepseek-v4-flash:max
    tour-builder: kimi-code/k3-256k:max
    designer: kimi-code/k3-256k:max
    librarian: dspeak/peak=openai-codex/gpt-5.6-luna:max&default=litellm/deepseek-v4-flash:max
    reviewer: kimi-code/k3-256k:max
    scout: dspeak/peak=openai-codex/gpt-5.6-luna:max&default=litellm/deepseek-v4-flash:max
    security-reviewer: openai-codex/gpt-5.6-sol:max
    sonic: litellm/deepseek-v4-flash:max
    task: litellm/deepseek-v4-flash:max
  eager: preferred
  agentAdvisor:
    task: "off"
dev:
  autoqaConsent: denied
  autoqa: true
lsp:
  diagnosticsOnEdit: true
  formatOnWrite: true
  lazy: true
display:
  showTokenUsage: true
  cacheMissMarker: true
branchSummary:
  enabled: true
contextPromotion:
  enabled: true
read:
  toolResultPreview: true
  renderMarkdown: true
  summarize:
    prose: true
github:
  enabled: true
  cache:
    enabled: true
    softTtlSec: 300
    hardTtlSec: 604800
defaultThinkingLevel: auto
advisor:
  enabled: false
tier:
  advisor: none
provider:
  appendOnlyContext: "on"
colorBlindMode: true
statusLine:
  separator: powerline
  transparent: false
python:
  kernelMode: session
readLineNumbers: true
steeringMode: all
git:
  enabled: true
images:
  describeForTextModels: true
astGrep:
  enabled: true
inspect_image:
  mode: auto
checkpoint:
  enabled: true
mcp:
  notifications: true
autolearn:
  enabled: true
  autoContinue: true
disabledExtensions: []
shellMinimizer:
  sourceOutlineLevel: aggressive
secrets:
  enabled: true
bash:
  direnv: auto
  autoBackground:
    enabled: true
security:
  enabled: true
browser:
  relay: true
composer:
  shape: rule
snapcompact:
  toolResults: true
