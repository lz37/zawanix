    - world
    - experience
    - observation
providers:
  tinyModelDevice: gpu
  tinyModelDtype: q4
generate_image:
  enabled: true
alarmClock:
  deliverAs: aside
modelRoles:
  tiny: local/lfm2.5-230m
  judge: local/lfm2.5-230m
