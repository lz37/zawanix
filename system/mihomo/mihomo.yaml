port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: error
redir-port: 7892
tproxy-port: 7895
mixed-port: 7893
external-controller: 127.0.0.1:9090
external-controller-cors:
  allow-private-network: true
bind-address: "*"
keep-alive-interval: 15
keep-alive-idle: 600
ipv6: true
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geodata-loader: standard
geox-url:
  geoip: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb
tcp-concurrent: true
unified-delay: true
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:7874
  prefer-h3: false
  respect-rules: false
  use-hosts: true
  # Resolve each policy through the same selector used by its application traffic.
  # Foreign policies race two clients; regional groups do not fan out together.
  nameserver-policy:
    "geosite:category-stun": &direct-dns
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
    "geosite:category-public-tracker": *direct-dns
    "geosite:category-pt": &main-proxy-dns
      - "https://1.1.1.1/dns-query#🚀 节点选择"
      - "https://8.8.8.8/dns-query#🚀 节点选择"
    "geosite:piratebay": *main-proxy-dns
    "geosite:nyaa": *main-proxy-dns
    "geosite:1337x": *main-proxy-dns
    "geosite:flatpak": *main-proxy-dns
    "geosite:google-play@cn": *direct-dns
    "geosite:google-cn": &google-dns
      - "https://1.1.1.1/dns-query#🇬 谷歌服务"
      - "https://8.8.8.8/dns-query#🇬 谷歌服务"
    "geosite:npmjs": *direct-dns
    "geosite:category-games@cn": *direct-dns
    "geosite:category-game-accelerator-cn": *direct-dns
    "geosite:category-communication":
      - "https://1.1.1.1/dns-query#💬 即时通讯"
      - "https://8.8.8.8/dns-query#💬 即时通讯"
    "geosite:category-social-media-!cn":
      - "https://1.1.1.1/dns-query#🌐 社交媒体"
      - "https://8.8.8.8/dns-query#🌐 社交媒体"
    "geosite:openai": &ai-dns
      - "https://1.1.1.1/dns-query#🤖 AI服务"
      - "https://8.8.8.8/dns-query#🤖 AI服务"
    "geosite:anthropic": *ai-dns
    "geosite:google-gemini": *ai-dns
    "geosite:docker":
      - "https://1.1.1.1/dns-query#🐟 docker"
      - "https://8.8.8.8/dns-query#🐟 docker"
    "geosite:github":
      - "https://1.1.1.1/dns-query#🐈‍⬛ GitHub"
      - "https://8.8.8.8/dns-query#🐈‍⬛ GitHub"
    "geosite:linkedin@cn": *direct-dns
    "geosite:linkedin":
      - "https://1.1.1.1/dns-query#🧑🏻‍💼 LinkedIn"
      - "https://8.8.8.8/dns-query#🧑🏻‍💼 LinkedIn"
    "geosite:category-speedtest":
      - "https://1.1.1.1/dns-query#🚀 测速工具"
      - "https://8.8.8.8/dns-query#🚀 测速工具"
    "geosite:youtube":
      - "https://1.1.1.1/dns-query#📹 YouTube"
      - "https://8.8.8.8/dns-query#📹 YouTube"
    "geosite:apple-cn": *direct-dns
    "geosite:apple-tvplus":
      - "https://1.1.1.1/dns-query#🎥 AppleTV+"
      - "https://8.8.8.8/dns-query#🎥 AppleTV+"
    "geosite:apple":
      - "https://1.1.1.1/dns-query#🍎 苹果服务"
      - "https://8.8.8.8/dns-query#🍎 苹果服务"
