port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: error
redir-port: 7892
tproxy-port: 7895
mixed-port: 7893
external-controller: 127.0.0.1:9090
external-controller-cors:
  allow-private-network: true
bind-address: "*"
keep-alive-interval: 15
keep-alive-idle: 600
ipv6: true
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geodata-loader: standard
geox-url:
  geoip: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb
tcp-concurrent: true
unified-delay: true
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:7874
  prefer-h3: false
  respect-rules: false
  use-hosts: true
  # Resolve each policy through the same selector used by its application traffic.
  # Foreign policies race two clients; regional groups do not fan out together.
  nameserver-policy:
    "geosite:category-stun": &direct-dns
      - https://223.5.5.5/dns-query # 阿里 DoH
      - https://1.12.12.12/dns-query # 腾讯 DoH
    "geosite:category-public-tracker": *direct-dns
    "geosite:google-play@cn": *direct-dns
    "geosite:npmjs": *direct-dns
    "geosite:category-games@cn": *direct-dns
    "geosite:category-game-accelerator-cn": *direct-dns
    "geosite:category-communication":
      - "https://1.1.1.1/dns-query#💬 即时通讯"
      - "https://8.8.8.8/dns-query#💬 即时通讯"
    "geosite:category-social-media-!cn":
      - "https://1.1.1.1/dns-query#🌐 社交媒体"
      - "https://8.8.8.8/dns-query#🌐 社交媒体"
    "geosite:openai,anthropic,google-gemini":
      - "https://1.1.1.1/dns-query#🤖 AI海外严格"
      - "https://8.8.8.8/dns-query#🤖 AI海外严格"
    "geosite:category-ai-!cn":
      - "https://1.1.1.1/dns-query#🤖 AI海外"
      - "https://8.8.8.8/dns-query#🤖 AI海外"
    # E-IX ships its own resolvers; public DNS returns different addresses for
    # both its node hostnames and (after the 2026-09-25 upgrade) potentially its
    # subscription endpoint, so route both through these. The proxy-node slot
    # below reuses this anchor.
    "+.eixcloud.com": &eix-dns
      - "https://zone.rlose.com:39933/api-query"
      - "https://radar.rlose.com/api-query"
    "+.usfoo.com": *eix-dns
    "geosite:docker":
      - "https://1.1.1.1/dns-query#🐟 docker"
      - "https://8.8.8.8/dns-query#🐟 docker"
    "geosite:github":
      - "https://1.1.1.1/dns-query#🐈‍⬛ GitHub"
      - "https://8.8.8.8/dns-query#🐈‍⬛ GitHub"
    "geosite:category-speedtest":
      - "https://1.1.1.1/dns-query#🚀 测速工具"
      - "https://8.8.8.8/dns-query#🚀 测速工具"
    "geosite:apple-cn": *direct-dns
    "geosite:apple":
      - "https://1.1.1.1/dns-query#🍎 苹果服务"
      - "https://8.8.8.8/dns-query#🍎 苹果服务"
    "geosite:microsoft@cn": *direct-dns
    "geosite:onedrive": *direct-dns
    "geosite:microsoft":
      - "https://1.1.1.1/dns-query#Ⓜ️ 微软服务"
      - "https://8.8.8.8/dns-query#Ⓜ️ 微软服务"
    "geosite:xiaomi": *direct-dns
    "geosite:google-cn,googlefcm,google":
      - "https://1.1.1.1/dns-query#🇬 谷歌服务"
      - "https://8.8.8.8/dns-query#🇬 谷歌服务"
    "geosite:dmm,abema,tver,unext,niconico,radiko":
      - "https://1.1.1.1/dns-query#🇯🇵 日本节点"
      - "https://8.8.8.8/dns-query#🇯🇵 日本节点"
    "rule-set:HuluJP":
      - "https://1.1.1.1/dns-query#🇯🇵 日本节点"
      - "https://8.8.8.8/dns-query#🇯🇵 日本节点"
    "geosite:category-porn":
      - "https://1.1.1.1/dns-query#🌏 非日本节点"
      - "https://8.8.8.8/dns-query#🌏 非日本节点"
    "geosite:tiktok":
      - "https://1.1.1.1/dns-query#🎶 TikTok"
      - "https://8.8.8.8/dns-query#🎶 TikTok"
    "geosite:bahamut,kktv,litv,hamivideo,catchplay,pchome,momo":
      - "https://1.1.1.1/dns-query#🇹🇼 台湾节点"
      - "https://8.8.8.8/dns-query#🇹🇼 台湾节点"
    "rule-set:LineTV,TaiWanGood,friDay":
      - "https://1.1.1.1/dns-query#🇹🇼 台湾节点"
      - "https://8.8.8.8/dns-query#🇹🇼 台湾节点"
    "geosite:category-entertainment-cn": *direct-dns
    "geosite:category-entertainment": &global-media-dns
      - "https://1.1.1.1/dns-query#🎬 流媒体"
      - "https://8.8.8.8/dns-query#🎬 流媒体"
    "geosite:amazon,category-ecommerce":
      - "https://1.1.1.1/dns-query#🛒 国外电商"
      - "https://8.8.8.8/dns-query#🛒 国外电商"
    "geosite:steam@cn": *direct-dns
    "geosite:steam,category-games":
      - "https://1.1.1.1/dns-query#🎮 游戏平台"
      - "https://8.8.8.8/dns-query#🎮 游戏平台"
    "geosite:category-pt,piratebay,nyaa,1337x,flatpak,gfw,geolocation-!cn":
      - "https://1.1.1.1/dns-query#🚀 节点选择"
      - "https://8.8.8.8/dns-query#🚀 节点选择"
    "geosite:cn": *direct-dns
  nameserver:
    - "https://1.1.1.1/dns-query#🐟 漏网之鱼"
    - "https://8.8.8.8/dns-query#🐟 漏网之鱼"
  default-nameserver:
    - https://223.5.5.5/dns-query # 阿里 DoH
    - https://1.12.12.12/dns-query # 腾讯 DoH
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query # 阿里 DoH
    - https://1.12.12.12/dns-query # 腾讯 DoH
  # E-IX resolves its node hostnames through its own resolvers; public
  # resolvers return different addresses that stop working after the
  # 2026-09-25 node upgrade. Scope the override to eixcloud.com so every
  # other provider keeps the public resolvers above.
  proxy-server-nameserver-policy:
    "+.eixcloud.com": *eix-dns
    "+.nchc.cc":
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
      - https://doh.dns.sb/dns-query
      - https://dns.cloudflare.com/dns-query
      - https://dns.twnic.tw/dns-query
      - https://8.8.4.4/dns-query
sniffer:
  enable: true
  override-destination: true
  sniff:
