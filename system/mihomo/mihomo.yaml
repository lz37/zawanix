# yaml-language-server: $schema=https://github.com/dongchengjie/meta-json-schema/releases/latest/download/meta-json-schema.json
proxy-providers-common: &proxy-providers-common
  type: http
  interval: 14400
  proxy: DIRECT
  size-limit: 0
  health-check:
    enable: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true
    expected-status: 204
  exclude-filter: (?i)距离下次重置剩余|套餐到期|剩余流量|官网|GooglePlay|防失联|特殊时期|导航网址|倍率提示|不能用就更新|WanDaYun|最新网址|星云|随便用
proxy-providers: {}

rule-providers:
  HuluJP:
    type: http
    behavior: classical
    format: yaml
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/HuluJP/HuluJP.yaml"
    path: ./providers/rule/HuluJP.yaml
    interval: 86400
    proxy: DIRECT
  LineTV:
    type: http
    behavior: classical
    format: yaml
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/LineTV/LineTV.yaml"
    path: ./providers/rule/LineTV.yaml
    interval: 86400
    proxy: DIRECT
  TaiWanGood:
    type: http
    behavior: classical
    format: yaml
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/TaiWanGood/TaiWanGood.yaml"
    path: ./providers/rule/TaiWanGood.yaml
    interval: 86400
    proxy: DIRECT
  friDay:
    type: http
    behavior: classical
    format: yaml
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/friDay/friDay.yaml"
    path: ./providers/rule/friDay.yaml
    interval: 86400
    proxy: DIRECT

url-test-common: &url-test-common
  type: url-test
  include-all: true
  tolerance: 20
  interval: 150
url-smart-common: &url-smart-common
  <<: *url-test-common
  uselightgbm: true
  type: smart
  prefer-asn: true
  sample-rate: 1.0
  collectdata: true
select-url-test: &select-url-test
  type: select
  proxies: &select-proxies-url-test
    - "🚀 节点选择"
    - ♻️ 自动选择
    - "🇭🇰 香港节点"
    - "🇹🇼 台湾节点"
    - "🇯🇵 日本节点"
    - "🇸🇬 新加坡节点"
    - "🇺🇸 美国节点"
    - "🇰🇷 韩国节点"
    - "🚀 手动切换"
    - "🎯 全球直连"
proxies: []

proxy-groups:
  - name: "🚀 节点选择"
    <<: *select-url-test
    proxies:
      - ♻️ 自动选择
      - "🇭🇰 香港节点"
      - "🇹🇼 台湾节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🇰🇷 韩国节点"
      - "🚀 手动切换"
      - "🎯 全球直连"
  - name: "🐈‍⬛ GitHub"
    <<: *select-url-test
  - name: "🐟 docker"
    <<: *select-url-test
  - name: "💬 即时通讯"
    <<: *select-url-test
  - name: "🌐 社交媒体"
    <<: *select-url-test
  - name: "🤖 AI海外"
    <<: *select-url-test
    proxies:
      - AI落地
      - ♻️ 自动选择
      - "🚀 节点选择"
      - "🇭🇰 香港节点"
      - "🇹🇼 台湾节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🇰🇷 韩国节点"
      - "🚀 手动切换"
      - "🎯 全球直连"
  - name: "🤖 AI海外严格"
    <<: *select-url-test
    proxies:
      - AI落地
      - ♻️ 自动选择
      - "🚀 节点选择"
      - "🇭🇰 香港节点"
      - "🇹🇼 台湾节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🇰🇷 韩国节点"
      - "🚀 手动切换"
      - "🎯 全球直连"
  - name: "🎬 流媒体"
    <<: *select-url-test
    proxies:
      - "🚀 节点选择"
      - ♻️ 自动选择
      - "🇭🇰 香港节点"
      - "🇹🇼 台湾节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🇰🇷 韩国节点"
      - "🚀 手动切换"
      - "🎯 全球直连"
  - name: "🎶 TikTok"
    <<: *select-url-test
  - name: "🌏 非日本节点"
    type: select
    proxies:
      - "🇭🇰 香港节点"
      - "🇹🇼 台湾节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
  - name: "📺 国内媒体"
    <<: *select-url-test
    proxies:
      - "🎯 全球直连"
      - "🇹🇼 台湾节点"
      - "🇭🇰 香港节点"
  - name: "🛒 国外电商"
    <<: *select-url-test
  - name: "🇬 谷歌服务"
    <<: *select-url-test
    proxies:
      - "🚀 节点选择"
      - ♻️ 自动选择
      - "🇭🇰 香港节点"
      - "🇹🇼 台湾节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🇰🇷 韩国节点"
      - "🚀 手动切换"
      - "🎯 全球直连"
  - name: "🍎 苹果服务"
    <<: *select-url-test
  - name: Ⓜ️ 微软服务
    <<: *select-url-test
  - name: "🎮 游戏平台"
    <<: *select-url-test
  - name: "🚀 测速工具"
    <<: *select-url-test
  - name: "🐟 漏网之鱼"
    <<: *select-url-test
  - name: "🎯 全球直连"
    type: select
    proxies:
      - DIRECT
  - name: "🇭🇰 香港节点"
    <<: *url-smart-common
    filter: "(?i)港|HK|hk|Hong Kong|HongKong|hongkong|深港"
  - name: "🇹🇼 台湾节点"
    <<: *url-smart-common
    filter: "(?i)台|新北|彰化|TW|Taiwan"
  - name: "🇯🇵 日本节点"
    <<: *url-smart-common
    filter: "(?i)日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|🇯🇵"
  - name: "🇸🇬 新加坡节点"
    <<: *url-smart-common
    filter: "(?i)新加坡|坡|狮城|SG|Singapore"
  - name: "🇺🇸 美国节点"
    <<: *url-smart-common
    filter: "美国|🇺🇸"
  - name: "🇰🇷 韩国节点"
    <<: *url-smart-common
    filter: "(?i)韩|Korea|🇰🇷"
  - name: ♻️ 自动选择
    <<: *url-smart-common
  - name: "🚀 手动切换"
    type: select
    include-all: true
  - name: "🇺🇸 美国中转"
    type: url-test
    include-all: true
    filter: "(?i)美国|US|United States|🇺🇸"
    exclude-filter: "(?i)Cloudflare|0\\.1倍率|节点选择|自动选择|手动切换|全球直连|香港节点|台湾节点|日本节点|新加坡节点|美国节点|韩国节点"
    # Probe endpoint is injected by patch (/proxy-groups/27/url).
    interval: 300
    tolerance: 50
  - name: AI落地
    type: url-test
    # Landing node names are injected via patch (/proxy-groups/28/proxies).
    proxies: []
    url: https://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 50
rules:
  - "DOMAIN-REGEX,^.*-pa\\.googleapis\\.com$,🤖 AI海外严格"
  - "DOMAIN-SUFFIX,generativelanguage.googleapis.com,🤖 AI海外严格"
  - "DOMAIN-SUFFIX,antigravity.google,🤖 AI海外严格"
  #- PROCESS-NAME,lucky,🎯 全球直连
