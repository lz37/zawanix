      - "https://8.8.8.8/dns-query#🎥 Netflix"
    "geosite:disney":
      - "https://1.1.1.1/dns-query#🎥 DisneyPlus"
      - "https://8.8.8.8/dns-query#🎥 DisneyPlus"
    "geosite:hbo":
      - "https://1.1.1.1/dns-query#🎥 HBO"
      - "https://8.8.8.8/dns-query#🎥 HBO"
