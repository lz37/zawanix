    "geosite:xiaomi": *direct-dns
    "geosite:googlefcm":
      - "https://1.1.1.1/dns-query#📢 谷歌FCM"
      - "https://8.8.8.8/dns-query#📢 谷歌FCM"
    "geosite:google": *google-dns
    "geosite:dmm-porn":
      - "https://1.1.1.1/dns-query#🇯🇵 日本节点"
      - "https://8.8.8.8/dns-query#🇯🇵 日本节点"
    "geosite:javdb": &non-jp-adult-dns
      - "https://1.1.1.1/dns-query#🌏 非日本节点"
      - "https://8.8.8.8/dns-query#🌏 非日本节点"
