      - "https://8.8.8.8/dns-query#🎻 Spotify"
    "geosite:bahamut":
      - "https://1.1.1.1/dns-query#📺 Bahamut"
      - "https://8.8.8.8/dns-query#📺 Bahamut"
    "geosite:category-entertainment-cn": *direct-dns
    "geosite:amazon": &ecommerce-dns
      - "https://1.1.1.1/dns-query#🛒 国外电商"
      - "https://8.8.8.8/dns-query#🛒 国外电商"
    "geosite:shopee": *ecommerce-dns
    "geosite:ozon": *ecommerce-dns
    "geosite:category-entertainment": &global-media-dns
      - "https://1.1.1.1/dns-query#🌎 国外媒体"
      - "https://8.8.8.8/dns-query#🌎 国外媒体"
    "geosite:category-ecommerce": *ecommerce-dns
    "geosite:steam@cn": *direct-dns
    "geosite:steam":
      - "https://1.1.1.1/dns-query#🎮 Steam"
      - "https://8.8.8.8/dns-query#🎮 Steam"
    "geosite:category-games":
      - "https://1.1.1.1/dns-query#🎮 游戏平台"
      - "https://8.8.8.8/dns-query#🎮 游戏平台"
    "geosite:gfw": *main-proxy-dns
    "geosite:geolocation-!cn": *main-proxy-dns
    "geosite:cn": *direct-dns
  nameserver:
    - "https://1.1.1.1/dns-query#🐟 漏网之鱼"
    - "https://8.8.8.8/dns-query#🐟 漏网之鱼"
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
sniffer:
  enable: true
  override-destination: true
  sniff:
    QUIC:
      ports:
        - 443
        - 8443
    TLS:
      ports:
        - 443
        - 8443
        - 6969
        - 1337
        - 2710
    HTTP:
      ports:
        - 80
        - 8080-8888
        - 6969
        - 1337
        - 2710
      override-destination: true
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - +.push.apple.com
  force-dns-mapping: true
  parse-pure-ip: true
  force-domain:
    - geosite:github
    - geosite:category-public-tracker
    - geosite:category-stun
    - +.v2ex.com
lgbm-auto-update: true
lgbm-url: https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-large.bin
lgbm-update-interval: 72
tun:
  stack: system
  auto-route: true
  auto-detect-interface: true
  gso: true
  strict-route: false
  # endpoint-independent-nat: true
  udp-timeout: 300
  route-exclude-address: []
  dns-hijack:
    - any:53
    - tcp://any:53
