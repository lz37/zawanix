# yaml-language-server: $schema=https://github.com/dongchengjie/meta-json-schema/releases/latest/download/meta-json-schema.json
proxy-providers-common: &proxy-providers-common
  type: http
  interval: 14400
  proxy: DIRECT
  size-limit: 0
  health-check:
    enable: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true
    expected-status: 204
  exclude-filter: (?i)距离下次重置剩余|套餐到期|剩余流量|官网|GooglePlay|防失联|特殊时期|导航网址|倍率提示|不能用就更新|WanDaYun|最新网址|星云
proxy-providers: {}

url-test-common: &url-test-common
  type: url-test
  include-all: true
  tolerance: 20
  interval: 150
url-smart-common: &url-smart-common
  <<: *url-test-common
  uselightgbm: true
  type: smart
  prefer-asn: true
  sample-rate: 1.0
  collectdata: true

select-url-test: &select-url-test
  type: select
  proxies: &select-proxies-url-test
    - 🚀 节点选择
    - ♻️ 自动选择
    - 🇭🇰 香港节点
    - 🇹🇼 台湾节点
    - 🇯🇵 日本节点
    - 🇸🇬 新加坡节点
    - 🇺🇸 美国节点
    - 🚀 手动切换
    - 🎯 全球直连
proxy-groups:
  - name: 🚀 节点选择
    <<: *select-url-test
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇺🇸 美国节点
      - 🚀 手动切换
      - 🎯 全球直连
  - name: 🐈‍⬛ GitHub
    <<: *select-url-test
  - name: 🐟 docker
    <<: *select-url-test
  - name: 💬 即时通讯
    <<: *select-url-test
  - name: 🌐 社交媒体
    <<: *select-url-test
  - name: 🧑🏻‍💼 LinkedIn
    <<: *select-url-test
  - name: 🤖 AI服务
    <<: *select-url-test
  - name: 🎶 TikTok
    <<: *select-url-test
  - name: 📹 YouTube
    <<: *select-url-test
  - name: 🎥 Netflix
    <<: *select-url-test
  - name: 🎥 DisneyPlus
    <<: *select-url-test
  - name: 🎥 HBO
    <<: *select-url-test
  - name: 🎥 AppleTV+
    <<: *select-url-test
  - name: 🎥 PrimeVideo
    <<: *select-url-test
  - name: 🎻 Spotify
    <<: *select-url-test
  - name: 📺 Bahamut
    <<: *select-url-test
    proxies:
      - 🇹🇼 台湾节点
      - 🚀 节点选择
      - 🚀 手动切换
      - 🎯 全球直连
  - name: 🌏 非日本节点
    type: select
    proxies:
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇸🇬 新加坡节点
      - 🇺🇸 美国节点
  - name: 📺 国内媒体
    <<: *select-url-test
    proxies:
      - 🎯 全球直连
      - 🇹🇼 台湾节点
      - 🇭🇰 香港节点
  - name: 🌎 国外媒体
    <<: *select-url-test
  - name: 🛒 国外电商
    <<: *select-url-test
  - name: 📢 谷歌FCM
    <<: *select-url-test
  - name: 🇬 谷歌服务
    <<: *select-url-test
  - name: 🍎 苹果服务
    <<: *select-url-test
  - name: Ⓜ️ 微软服务
    <<: *select-url-test
  - name: 🎮 游戏平台
    <<: *select-url-test
  - name: 🎮 Steam
    <<: *select-url-test
  - name: 🚀 测速工具
    <<: *select-url-test
  - name: 🐟 漏网之鱼
    <<: *select-url-test
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
  - name: 🇭🇰 香港节点
    <<: *url-smart-common
    filter: "(?i)港|HK|hk|Hong Kong|HongKong|hongkong|深港"
  - name: 🇹🇼 台湾节点
    <<: *url-smart-common
    filter: "(?i)台|新北|彰化|TW|Taiwan"
  - name: 🇯🇵 日本节点
    <<: *url-smart-common
    filter: "(?i)日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|🇯🇵"
  - name: 🇸🇬 新加坡节点
    <<: *url-smart-common
    filter: "(?i)新加坡|坡|狮城|SG|Singapore"
  - name: 🇺🇸 美国节点
    <<: *url-smart-common
    filter: "美国|🇺🇸"
  - name: ♻️ 自动选择
    <<: *url-smart-common
  - name: 🚀 手动切换
    type: select
    include-all: true

rules:
  #- PROCESS-NAME,lucky,🎯 全球直连
  - GEOSITE,private,🎯 全球直连
  - GEOIP,private,🎯 全球直连,no-resolve
  - PROCESS-NAME,tailscale,🎯 全球直连
  - PROCESS-NAME,tailscaled,🎯 全球直连
  - PROCESS-NAME,zerotier-one,🎯 全球直连
  - AND,((NETWORK,UDP),(DST-PORT,123)),🎯 全球直连
  # STUN bypasses the proxy; it is not blocked.
  - DST-PORT,3478,🎯 全球直连
  - GEOSITE,category-stun,🎯 全球直连
  # Tracker endpoints stay direct; PT/index sites use the proxy.
  - GEOSITE,category-public-tracker,🎯 全球直连
  - GEOSITE,category-pt,🚀 节点选择
  - GEOSITE,piratebay,🚀 节点选择
  - GEOSITE,nyaa,🚀 节点选择
  - GEOSITE,1337x,🚀 节点选择
  - GEOSITE,flatpak,🚀 节点选择
